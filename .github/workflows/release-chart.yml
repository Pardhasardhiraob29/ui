name: Release UI Helm Chart

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  publish-chart:
    name: Publish Helm Chart to GHCR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.12.0

      - name: Log in to GitHub Container Registry (User Namespace)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract tag name
        run: echo "RELEASE_TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Clean old chart packages
        run: rm -f ./*.tgz

      - name: Package Helm Chart
        run: |
          helm package chart \
            --version "${{ env.RELEASE_TAG }}" \
            --app-version "${{ env.RELEASE_TAG }}"

      - name: Push Helm Chart to GitHub Container Registry (User Namespace)
        run: |
          CHART_TGZ=$(find . -maxdepth 1 -name "*.tgz" | head -n 1)
          echo "Found packaged chart: $CHART_TGZ"
          helm push "$CHART_TGZ" oci://ghcr.io/pardhasardhiraob29/ui

      - name: Verify pushed chart
        run: |
          helm repo add ghcr-charts oci://ghcr.io/pardhasardhiraob29/ui
          helm search repo ghcr-charts

